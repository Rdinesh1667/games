<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Arrow Escape</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    overflow-x: hidden;
}

body {
    min-height: 100dvh;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #ffffff 0%,
            #eef2f7 45%,
            #dfe5ec 100%
        );

    color: #17202a;

    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
}

button {
    font: inherit;
}


/* =========================================
   GAME
========================================= */

.game {
    width: 100%;
    max-width: 720px;
    min-height: 100dvh;

    margin: 0 auto;

    padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));

    display: flex;
    flex-direction: column;
}


/* =========================================
   HEADER
========================================= */

.header {
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 8px;

    margin-bottom: 10px;
}

.logo {
    font-size: clamp(20px, 6vw, 28px);
    font-weight: 900;

    letter-spacing: -1px;

    white-space: nowrap;
}

.logo span {
    color: #ff5b35;
}

.stats {
    display: flex;
    gap: 5px;
}

.stat {
    min-width: 52px;

    padding: 5px 8px;

    border-radius: 10px;

    text-align: center;

    background: rgba(255,255,255,.8);

    border: 1px solid rgba(0,0,0,.06);

    box-shadow:
        0 5px 18px rgba(0,0,0,.05);
}

.stat small {
    display: block;

    color: #7b8794;

    font-size: 8px;

    font-weight: 800;

    text-transform: uppercase;
}

.stat strong {
    display: block;

    font-size: 14px;
}


/* =========================================
   CONTROLS
========================================= */

.controls {
    width: 100%;

    display: flex;

    gap: 6px;

    margin-bottom: 8px;
}

.difficulty {
    min-width: 0;

    flex: 1;

    display: flex;

    gap: 3px;

    padding: 3px;

    background: #e4e9ef;

    border-radius: 11px;
}

.difficulty button {
    min-width: 0;

    flex: 1;

    padding: 8px 4px;

    border: 0;

    border-radius: 8px;

    background: transparent;

    color: #64717d;

    font-size: 12px;

    font-weight: 800;

    cursor: pointer;
}

.difficulty button.active {
    background: white;

    color: #17202a;

    box-shadow:
        0 3px 10px rgba(0,0,0,.08);
}

.action {
    width: 40px;
    min-width: 40px;
    height: 40px;

    border: 0;

    border-radius: 10px;

    background: white;

    cursor: pointer;

    font-size: 17px;

    box-shadow:
        0 5px 15px rgba(0,0,0,.07);

    touch-action: manipulation;
}


/* =========================================
   BOARD WRAPPER
========================================= */

.board-wrapper {
    width: 100%;

    flex: 1;

    min-height: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 4px 0 10px;
}


/* =========================================
   BOARD
========================================= */

#board {
    --size: 7;

    width:
        min(
            calc(100vw - 24px),
            calc(100dvh - 190px),
            620px
        );

    aspect-ratio: 1 / 1;

    display: grid;

    grid-template-columns:
        repeat(var(--size), 1fr);

    grid-template-rows:
        repeat(var(--size), 1fr);

    gap:
        clamp(
            2px,
            0.8vw,
            5px
        );

    padding:
        clamp(
            4px,
            1.5vw,
            8px
        );

    border-radius:
        clamp(
            14px,
            4vw,
            24px
        );

    background:
        rgba(255,255,255,.55);

    box-shadow:
        0 20px 50px rgba(31,41,55,.12),
        inset 0 0 0 1px rgba(255,255,255,.8);
}


/* =========================================
   CELLS
========================================= */

.cell {
    position: relative;

    min-width: 0;
    min-height: 0;

    border-radius:
        clamp(
            5px,
            1.5vw,
            10px
        );
}

.cell.valid {
    background:
        rgba(207,214,223,.42);
}

.cell.invalid {
    opacity: 0;

    pointer-events: none;
}


/* =========================================
   ARROWS
========================================= */

.arrow {
    position: absolute;

    inset:
        clamp(
            1px,
            .6vw,
            3px
        );

    border-radius:
        clamp(
            5px,
            1.5vw,
            9px
        );

    display: flex;

    align-items: center;
    justify-content: center;

    font-size:
        clamp(
            18px,
            calc(72vw / var(--size)),
            42px
        );

    font-weight: 900;

    color: white;

    cursor: pointer;

    user-select: none;

    touch-action: manipulation;

    box-shadow:
        inset 0 -3px 0 rgba(0,0,0,.10),
        0 3px 7px rgba(0,0,0,.08);

    transition:
        transform .16s ease,
        opacity .16s ease,
        filter .16s ease;
}

.arrow:active {
    transform: scale(.86);
}

.arrow:hover {
    filter: brightness(1.06);
}

.arrow.removing {
    opacity: 0;

    transform:
        translate(
            var(--exit-x),
            var(--exit-y)
        )
        scale(.6);
}

.arrow.blocked {
    animation:
        shake .22s ease;
}

.arrow.hint {
    animation:
        hintPulse .7s ease infinite alternate;
}

@keyframes shake {

    0%,
    100% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-4px);
    }

    75% {
        transform: translateX(4px);
    }
}

@keyframes hintPulse {

    from {
        box-shadow:
            0 0 0 0
            rgba(255,193,7,.15);
    }

    to {
        box-shadow:
            0 0 0 7px
            rgba(255,193,7,.45);
    }
}


/* =========================================
   FOOTER
========================================= */

.footer {
    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 8px;

    padding-top: 5px;
}

.message {
    min-width: 0;

    color: #687583;

    font-size: 11px;

    line-height: 1.3;

    font-weight: 700;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.new-game {
    flex-shrink: 0;

    border: 0;

    background: #17202a;

    color: white;

    padding: 10px 13px;

    border-radius: 10px;

    font-size: 12px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 7px 18px rgba(23,32,42,.2);

    touch-action: manipulation;
}


/* =========================================
   WIN SCREEN
========================================= */

.overlay {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(20,28,38,.58);

    backdrop-filter:
        blur(7px);
}

.overlay.show {
    display: flex;
}

.win-card {
    width: min(92vw, 380px);

    background: white;

    border-radius: 28px;

    padding: 30px;

    text-align: center;

    box-shadow:
        0 30px 80px rgba(0,0,0,.25);

    animation:
        pop .3s ease;
}

.win-icon {
    font-size: 60px;

    margin-bottom: 5px;
}

.win-card h2 {
    margin: 0 0 5px;

    font-size: 30px;
}

.win-card p {
    color: #687583;

    margin: 0 0 22px;
}

.win-card button {
    border: 0;

    background: #ff5b35;

    color: white;

    padding: 13px 25px;

    border-radius: 14px;

    font-weight: 900;

    cursor: pointer;

    touch-action: manipulation;
}

@keyframes pop {

    from {
        opacity: 0;

        transform:
            scale(.8);
    }

    to {
        opacity: 1;

        transform:
            scale(1);
    }
}


/* =========================================
   SMALL PHONES
========================================= */

@media (max-width: 380px) {

    .game {
        padding-left: 8px;
        padding-right: 8px;
    }

    .logo {
        font-size: 19px;
    }

    .stat {
        min-width: 45px;

        padding: 4px 6px;
    }

    .stat small {
        font-size: 7px;
    }

    .stat strong {
        font-size: 12px;
    }

    .difficulty button {
        font-size: 10px;

        padding: 7px 2px;
    }

    .action {
        width: 36px;
        min-width: 36px;
        height: 36px;
    }

    .new-game {
        padding: 9px 10px;

        font-size: 11px;
    }
}


/* =========================================
   LANDSCAPE MOBILE
========================================= */

@media (
    max-height: 500px
) and (
    orientation: landscape
) {

    .game {
        padding-top: 6px;
        padding-bottom: 6px;
    }

    .header {
        margin-bottom: 4px;
    }

    .controls {
        margin-bottom: 4px;
    }

    .board-wrapper {
        padding: 2px 0;
    }

    #board {
        width:
            min(
                calc(100vw - 150px),
                calc(100dvh - 80px)
            );
    }

    .footer {
        display: none;
    }
}
</style>
</head>


<body>

<div class="game">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            ARROW<span>ESCAPE</span>
        </div>

        <div class="stats">

            <div class="stat">
                <small>Moves</small>
                <strong id="moves">0</strong>
            </div>

            <div class="stat">
                <small>Left</small>
                <strong id="remaining">0</strong>
            </div>

        </div>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <div class="difficulty">

            <button
                data-level="easy"
                class="active"
            >
                Easy
            </button>

            <button
                data-level="medium"
            >
                Medium
            </button>

            <button
                data-level="hard"
            >
                Hard
            </button>

        </div>


        <button
            class="action"
            id="undo"
            aria-label="Undo"
        >
            ↶
        </button>


        <button
            class="action"
            id="hint"
            aria-label="Hint"
        >
            💡
        </button>

    </div>


    <!-- BOARD -->

    <div class="board-wrapper">

        <div id="board"></div>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        <div
            class="message"
            id="message"
        >
            Find an arrow with a clear path.
        </div>

        <button
            class="new-game"
            id="newGame"
        >
            New Puzzle
        </button>

    </div>

</div>


<!-- WIN SCREEN -->

<div
    class="overlay"
    id="overlay"
>

    <div class="win-card">

        <div class="win-icon">
            🎉
        </div>

        <h2>
            Board Cleared!
        </h2>

        <p>
            You solved the puzzle in
            <strong id="winMoves">0</strong>
            moves.
        </p>

        <button id="nextPuzzle">
            Next Puzzle
        </button>

    </div>

</div>


<script>

/* =========================================
   DOM
========================================= */

const boardElement =
    document.getElementById("board");

const movesElement =
    document.getElementById("moves");

const remainingElement =
    document.getElementById("remaining");

const messageElement =
    document.getElementById("message");

const overlay =
    document.getElementById("overlay");

const winMoves =
    document.getElementById("winMoves");


/* =========================================
   DIRECTIONS
========================================= */

const DIRECTIONS = {

    up: {
        dx: 0,
        dy: -1,
        symbol: "↑"
    },

    down: {
        dx: 0,
        dy: 1,
        symbol: "↓"
    },

    left: {
        dx: -1,
        dy: 0,
        symbol: "←"
    },

    right: {
        dx: 1,
        dy: 0,
        symbol: "→"
    }

};


/* =========================================
   COLORS
========================================= */

const COLORS = [

    "#ff6b6b",
    "#4dabf7",
    "#51cf66",
    "#fcc419",
    "#845ef7",
    "#f06595",
    "#20c997",
    "#ff922b",
    "#74c0fc",
    "#63e6be",
    "#da77f2",
    "#a9e34b"

];


/* =========================================
   LEVELS
========================================= */

const LEVELS = {

    easy: {

        size: 6,

        arrows: 14,

        shapes: [
            "square",
            "diamond"
        ]

    },

    medium: {

        size: 7,

        arrows: 25,

        shapes: [
            "square",
            "cross",
            "diamond",
            "corner"
        ]

    },

    hard: {

        size: 8,

        arrows: 39,

        shapes: [
            "square",
            "cross",
            "diamond",
            "corner",
            "plus"
        ]

    }

};


/* =========================================
   GAME STATE
========================================= */

let level = "easy";

let puzzle = null;

let history = [];

let moves = 0;

let inputLocked = false;


/* =========================================
   RANDOM
========================================= */

function randomItem(array) {

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}


function shuffle(array) {

    const copy = [...array];

    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            copy[i],
            copy[j]
        ] = [
            copy[j],
            copy[i]
        ];

    }

    return copy;

}


/* =========================================
   CREATE BOARD SHAPE
========================================= */

function createShape(size, shape) {

    const cells = [];

    const center =
        (size - 1) / 2;


    for (
        let y = 0;
        y < size;
        y++
    ) {

        for (
            let x = 0;
            x < size;
            x++
        ) {

            let valid = true;


            /* SQUARE */

            if (shape === "square") {

                valid = true;

            }


            /* DIAMOND */

            if (shape === "diamond") {

                valid =
                    Math.abs(x - center) +
                    Math.abs(y - center)
                    <= center + 0.5;

            }


            /* CROSS */

            if (shape === "cross") {

                const middle =
                    Math.floor(size / 2);

                valid =
                    Math.abs(x - middle) <= 1 ||
                    Math.abs(y - middle) <= 1;

            }


            /* CORNER */

            if (shape === "corner") {

                valid =
                    x <= center ||
                    y <= center;

            }


            /* PLUS */

            if (shape === "plus") {

                const middle =
                    Math.floor(size / 2);

                valid =
                    Math.abs(x - middle) <= 1 ||
                    Math.abs(y - middle) <= 1 ||
                    (
                        x > center &&
                        y > center
                    );

            }


            if (valid) {

                cells.push({
                    x,
                    y
                });

            }

        }

    }

    return cells;

}


/* =========================================
   CAN ARROW EXIT?
========================================= */

function canExit(
    arrow,
    occupied,
    validSet,
    size
) {

    const direction =
        DIRECTIONS[arrow.direction];

    let x =
        arrow.x +
        direction.dx;

    let y =
        arrow.y +
        direction.dy;


    while (
        x >= 0 &&
        x < size &&
        y >= 0 &&
        y < size
    ) {

        const key =
            `${x},${y}`;


        /*
         * Outside the shape.
         * Arrow can leave.
         */

        if (!validSet.has(key)) {

            return true;

        }


        /*
         * Another arrow blocks it.
         */

        if (occupied.has(key)) {

            return false;

        }


        x += direction.dx;

        y += direction.dy;

    }


    return true;

}


/* =========================================
   GENERATE PUZZLE
========================================= */

function generatePuzzle() {

    const config =
        LEVELS[level];


    for (
        let attempt = 0;
        attempt < 100;
        attempt++
    ) {

        const shape =
            randomItem(config.shapes);


        const validCells =
            createShape(
                config.size,
                shape
            );


        const validSet =
            new Set(
                validCells.map(
                    cell =>
                        `${cell.x},${cell.y}`
                )
            );


        const shuffledCells =
            shuffle(validCells);


        const arrows = [];

        const occupied =
            new Set();


        const target =
            Math.min(
                config.arrows,
                validCells.length - 2
            );


        for (
            const cell
            of shuffledCells
        ) {

            if (
                arrows.length >= target
            ) {
                break;
            }


            const directions =
                shuffle(
                    Object.keys(
                        DIRECTIONS
                    )
                );


            let selected = null;


            for (
                const direction
                of directions
            ) {

                const candidate = {

                    x: cell.x,

                    y: cell.y,

                    direction

                };


                if (
                    canExit(
                        candidate,
                        occupied,
                        validSet,
                        config.size
                    )
                ) {

                    selected =
                        candidate;

                    break;

                }

            }


            if (!selected) {
                continue;
            }


            arrows.push(
                selected
            );


            occupied.add(
                `${cell.x},${cell.y}`
            );

        }


        if (
            arrows.length <
            target * 0.8
        ) {

            continue;

        }


        const finalArrows =
            shuffle(arrows)
                .map(
                    (arrow, index) => ({

                        ...arrow,

                        id: index,

                        color:
                            COLORS[
                                index %
                                COLORS.length
                            ]

                    })
                );


        return {

            size: config.size,

            shape,

            validCells,

            arrows:
                finalArrows

        };

    }


    return generateSimplePuzzle();

}


/* =========================================
   FALLBACK PUZZLE
========================================= */

function generateSimplePuzzle() {

    const size = 6;

    const validCells =
        createShape(
            size,
            "square"
        );

    const arrows = [];

    const directions = [
        "up",
        "down",
        "left",
        "right"
    ];


    for (
        let i = 0;
        i < 14;
        i++
    ) {

        const cell =
            validCells[i];


        arrows.push({

            id: i,

            x: cell.x,

            y: cell.y,

            direction:
                directions[i % 4],

            color:
                COLORS[
                    i % COLORS.length
                ]

        });

    }


    return {

        size,

        shape: "square",

        validCells,

        arrows

    };

}


/* =========================================
   RENDER
========================================= */

function render() {

    const {
        size,
        validCells,
        arrows
    } = puzzle;


    boardElement.style.setProperty(
        "--size",
        size
    );


    boardElement.innerHTML = "";


    const validSet =
        new Set(
            validCells.map(
                cell =>
                    `${cell.x},${cell.y}`
            )
        );


    /*
     * Create cells.
     */

    for (
        let y = 0;
        y < size;
        y++
    ) {

        for (
            let x = 0;
            x < size;
            x++
        ) {

            const cell =
                document.createElement(
                    "div"
                );


            const key =
                `${x},${y}`;


            cell.className =
                validSet.has(key)
                    ? "cell valid"
                    : "cell invalid";


            cell.dataset.x = x;

            cell.dataset.y = y;


            boardElement.appendChild(
                cell
            );

        }

    }


    /*
     * Add arrows.
     */

    const cells =
        [...boardElement.children];


    for (
        const arrow
        of arrows
    ) {

        const index =
            arrow.y * size +
            arrow.x;


        const cell =
            cells[index];


        if (!cell) {
            continue;
        }


        const element =
            document.createElement(
                "div"
            );


        element.className =
            "arrow";


        element.textContent =
            DIRECTIONS[
                arrow.direction
            ].symbol;


        element.style.background =
            arrow.color;


        element.dataset.id =
            arrow.id;


        /*
         * Mobile-friendly pointer input.
         */

        element.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();

                handleArrowClick(
                    arrow.id
                );

            }
        );


        cell.appendChild(
            element
        );

    }


    movesElement.textContent =
        moves;


    remainingElement.textContent =
        arrows.length;


    if (
        arrows.length === 0
    ) {

        showWin();

    }

}


/* =========================================
   CLICK ARROW
========================================= */

function handleArrowClick(id) {

    if (inputLocked) {
        return;
    }


    const arrow =
        puzzle.arrows.find(
            a => a.id === id
        );


    if (!arrow) {
        return;
    }


    const occupied =
        new Set(
            puzzle.arrows.map(
                a =>
                    `${a.x},${a.y}`
            )
        );


    const validSet =
        new Set(
            puzzle.validCells.map(
                cell =>
                    `${cell.x},${cell.y}`
            )
        );


    occupied.delete(
        `${arrow.x},${arrow.y}`
    );


    const clear =
        canExit(
            arrow,
            occupied,
            validSet,
            puzzle.size
        );


    /*
     * BLOCKED
     */

    if (!clear) {

        const element =
            document.querySelector(
                `.arrow[data-id="${id}"]`
            );


        if (element) {

            element.classList.add(
                "blocked"
            );


            setTimeout(
                () => {

                    element.classList.remove(
                        "blocked"
                    );

                },
                250
            );

        }


        messageElement.textContent =
            "Blocked! Clear the arrows in front first.";

        return;

    }


    /*
     * VALID MOVE
     */

    inputLocked = true;


    history.push(
        JSON.stringify(
            puzzle.arrows
        )
    );


    moves++;


    const element =
        document.querySelector(
            `.arrow[data-id="${id}"]`
        );


    if (element) {

        const direction =
            DIRECTIONS[
                arrow.direction
            ];


        const distance =
            puzzle.size * 80;


        element.style.setProperty(
            "--exit-x",
            `${direction.dx * distance}px`
        );


        element.style.setProperty(
            "--exit-y",
            `${direction.dy * distance}px`
        );


        element.classList.add(
            "removing"
        );

    }


    setTimeout(
        () => {

            puzzle.arrows =
                puzzle.arrows.filter(
                    a => a.id !== id
                );


            inputLocked = false;


            messageElement.textContent =
                "Find an arrow with a clear path.";


            render();

        },
        180
    );

}


/* =========================================
   UNDO
========================================= */

function undo() {

    if (
        inputLocked ||
        !history.length
    ) {
        return;
    }


    const previous =
        history.pop();


    puzzle.arrows =
        JSON.parse(
            previous
        );


    moves =
        Math.max(
            0,
            moves - 1
        );


    overlay.classList.remove(
        "show"
    );


    messageElement.textContent =
        "Move undone.";


    render();

}


/* =========================================
   HINT
========================================= */

function hint() {

    if (
        !puzzle.arrows.length
    ) {
        return;
    }


    const occupied =
        new Set(
            puzzle.arrows.map(
                arrow =>
                    `${arrow.x},${arrow.y}`
            )
        );


    const validSet =
        new Set(
            puzzle.validCells.map(
                cell =>
                    `${cell.x},${cell.y}`
            )
        );


    let candidate = null;


    for (
        const arrow
        of puzzle.arrows
    ) {

        const others =
            new Set(
                occupied
            );


        others.delete(
            `${arrow.x},${arrow.y}`
        );


        if (
            canExit(
                arrow,
                others,
                validSet,
                puzzle.size
            )
        ) {

            candidate =
                arrow;

            break;

        }

    }


    if (!candidate) {
        return;
    }


    const element =
        document.querySelector(
            `.arrow[data-id="${candidate.id}"]`
        );


    if (!element) {
        return;
    }


    element.classList.add(
        "hint"
    );


    messageElement.textContent =
        "Try the highlighted arrow.";


    setTimeout(
        () => {

            element.classList.remove(
                "hint"
            );


            messageElement.textContent =
                "Find an arrow with a clear path.";

        },
        1800
    );

}


/* =========================================
   NEW GAME
========================================= */

function newGame() {

    overlay.classList.remove(
        "show"
    );


    history = [];

    moves = 0;

    inputLocked = false;


    puzzle =
        generatePuzzle();


    messageElement.textContent =
        "Find an arrow with a clear path.";


    render();

}


/* =========================================
   WIN
========================================= */

function showWin() {

    winMoves.textContent =
        moves;


    setTimeout(
        () => {

            overlay.classList.add(
                "show"
            );

        },
        250
    );

}


/* =========================================
   BUTTON EVENTS
========================================= */

document
    .getElementById("newGame")
    .addEventListener(
        "click",
        newGame
    );


document
    .getElementById("nextPuzzle")
    .addEventListener(
        "click",
        newGame
    );


document
    .getElementById("undo")
    .addEventListener(
        "click",
        undo
    );


document
    .getElementById("hint")
    .addEventListener(
        "click",
        hint
    );


document
    .querySelectorAll(
        ".difficulty button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".difficulty button"
                        )
                        .forEach(
                            b =>
                                b.classList.remove(
                                    "active"
                                )
                        );


                    button.classList.add(
                        "active"
                    );


                    level =
                        button.dataset.level;


                    newGame();

                }
            );

        }
    );


/* =========================================
   START GAME
========================================= */

newGame();

</script>
