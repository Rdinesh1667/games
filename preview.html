<body>
<div class="app">

</div>

<script>
"use strict";

/* ---------- storage ---------- */
const STORE="arrowRushV3";
const saved=JSON.parse(localStorage.getItem(STORE)||"{}");
let mode=saved.mode||"easy";
let current=Number(saved.current)||1;
let unlocked=Math.max(1,Number(saved.unlocked)||1);
let scores=saved.scores||{};
let streak=Number(saved.streak)||0;
let dark=!!saved.dark;

/* ---------- constants ---------- */
const DIRS={
 U:{dx:0,dy:-1,s:"↑",rot:0},
 R:{dx:1,dy:0,s:"→",rot:90},
 D:{dx:0,dy:1,s:"↓",rot:180},
 L:{dx:-1,dy:0,s:"←",rot:270}
};
const COLORS=["#ff5b5b","#4d96ff","#38c878","#ffbd2e","#8b5cf6","#ef5da8","#16c7b7","#ff8743","#38bdf8","#a3e635","#c084fc","#fb7185"];
const $=id=>document.getElementById(id);
const board=$("board");

/* ---------- state ---------- */
let game=null,history=[],moves=0,errors=0,elapsed=0,timer=null,started=false,paused=false,locked=false,hintId=null,combo=0,bestCombo=0;

/* ---------- helpers ---------- */
function save(){localStorage.setItem(STORE,JSON.stringify({current,unlocked,scores,streak,dark,mode}));}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function key(x,y){return x+","+y}
function timeText(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function config(level){
 const l=Math.max(1,level);

 if(mode==="easy"){
  return {
   difficulty:"Easy",
   n:l<12?6:l<30?7:8,
   count:Math.min(8+Math.floor(l*.22),24),
   shapes:["square","diamond"]
  };
 }

 if(mode==="medium"){
  return {
   difficulty:"Medium",
   n:l<12?7:l<30?8:l<70?9:10,
   count:Math.min(18+Math.floor(l*.36),38),
   shapes:["square","diamond","cross","corner","plus"]
  };
 }

 // Hard is about DEPENDENCY, not filling the board.
 // Larger board + deliberately low number of initially-clear arrows.
 return {
  difficulty:"Hard",
  n:l<10?9:l<25?10:l<60?11:12,
  count:Math.min(24+Math.floor(l*.28),48),
  shapes:["square","diamond","cross","plus","corner","triangle","ring"]
 };
}
function shapeCells(n,type){
 const c=(n-1)/2,out=[];
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){
  let v=false;
  if(type==="square")v=true;
  if(type==="diamond")v=Math.abs(x-c)+Math.abs(y-c)<=c+.5;
  if(type==="cross"){let m=Math.floor(n/2);v=Math.abs(x-m)<=1||Math.abs(y-m)<=1}
  if(type==="corner")v=x<=c||y<=c;
  if(type==="plus"){let m=Math.floor(n/2);v=Math.abs(x-m)<=1||Math.abs(y-m)<=1||(x>c&&y>c)}
  if(type==="triangle")v=y>=Math.abs(x-c);
  if(type==="ring"){let d=Math.hypot(x-c,y-c);v=d>=c*.48&&d<=c*1.05}
  if(v)out.push({x,y});
 }
 return out;
}

/* ---------- true solvable generator ----------
   Build a solution backwards. Every newly-added arrow
   must have a clear ray through the currently occupied
   cells. The final board is exactly the same board, and
   the reverse construction order is a verified solution.
*/
function rayClear(a,occupied,valid,n){
 const d=DIRS[a.d];let x=a.x+d.dx,y=a.y+d.dy;
 while(x>=0&&x<n&&y>=0&&y<n){
  if(!valid.has(key(x,y)))return true; // outside playable shape
  if(occupied.has(key(x,y)))return false;
  x+=d.dx;y+=d.dy;
 }
 return true;
}

function hardDifficultyOrder(cells,n){
 // Bias placement toward central lanes and alternating rows/columns. This
 // produces crossing dependencies while leaving useful empty escape lanes.
 const cx=(n-1)/2, cy=(n-1)/2;
 return [...cells].sort((a,b)=>{
  const da=Math.abs(a.x-cx)+Math.abs(a.y-cy);
  const db=Math.abs(b.x-cx)+Math.abs(b.y-cy);
  return da-db || Math.random()-.5;
 });
}

function hardChainScore(arrows){
 // Estimate how many arrows are initially blocked. Hard puzzles should have
 // very few immediately-clear choices, while still retaining a solution.
 let clear=0;
 const occ=new Set(arrows.map(a=>key(a.x,a.y)));
 const valid=new Set(game?.valid?.map(c=>key(c.x,c.y))||[]);
 if(!valid.size)return 0;
 for(const a of arrows){
  const copy=new Set(occ); copy.delete(key(a.x,a.y));
  if(rayClear(a,copy,valid,arrows.n||12))clear++;
 }
 return clear;
}

function buildPuzzle(){
 const cfg=config(current);

 for(let attempt=0;attempt<1200;attempt++){
  const type=mode==="hard" ? "square" : rnd(cfg.shapes);
  const cells=mode==="hard"
    ? Array.from({length:cfg.n*cfg.n},(_,i)=>({x:i%cfg.n,y:Math.floor(i/cfg.n)}))
    : shapeCells(cfg.n,type);

  const valid=new Set(cells.map(c=>key(c.x,c.y)));
  const target=mode==="hard" ? cells.length : Math.min(cfg.count,cells.length);

  /*
   * Hard mode:
   * Build the puzzle backwards. At each step, add an arrow whose exit ray
   * is clear through the arrows already placed. Reversing the construction
   * gives a guaranteed solution. Since every cell is processed, every cell
   * receives exactly one arrow.
   */
  const occupied=new Set();
  const arr=[];
  const order=shuffle(cells);

  if(mode==="hard"){
   for(const cell of order){
    const directions=shuffle(Object.keys(DIRS));
    let chosen=null;

    for(const d of directions){
     const candidate={x:cell.x,y:cell.y,d};
     if(rayClear(candidate,occupied,valid,cfg.n)){
      chosen=d;
      break;
     }
    }

    if(!chosen){
     arr.length=0;
     break;
    }

    arr.push({
     x:cell.x,
     y:cell.y,
     d:chosen,
     id:arr.length,
     color:COLORS[arr.length%COLORS.length]
    });
    occupied.add(key(cell.x,cell.y));
   }

   if(arr.length!==cells.length)continue;
  }else{
   const ordered=shuffle(cells);
   for(const cell of ordered){
    if(arr.length>=target)break;

    const dirs=mode==="hard"
      ? Object.keys(DIRS).sort((a,b)=>{
         const da=DIRS[a], db=DIRS[b];
         const aheadA=occupied.has(key(cell.x+da.dx,cell.y+da.dy))?1:0;
         const aheadB=occupied.has(key(cell.x+db.dx,cell.y+db.dy))?1:0;
         return aheadB-aheadA || Math.random()-.5;
        })
      : shuffle(Object.keys(DIRS));
    for(const d of dirs){
     const candidate={x:cell.x,y:cell.y,d};
     if(rayClear(candidate,occupied,valid,cfg.n)){
      arr.push({
       x:cell.x,
       y:cell.y,
       d,
       id:arr.length,
       color:COLORS[arr.length%COLORS.length]
      });
      occupied.add(key(cell.x,cell.y));
      break;
     }
    }
   }

   if(arr.length!==target)continue;
  }

  /*
   * Final verification:
   * Starting with the complete board, repeatedly remove the reverse-built
   * arrows. If every arrow has a clear exit at its turn, the puzzle is valid.
   */
  const test=arr.map(a=>({...a}));
  let validSolution=true;

  for(let i=test.length-1;i>=0;i--){
   const a=test[i];
   const occ=new Set(test.map(z=>key(z.x,z.y)));
   occ.delete(key(a.x,a.y));

   if(!rayClear(a,occ,valid,cfg.n)){
    validSolution=false;
    break;
   }

   test.splice(i,1);
  }

  if(!validSolution)continue;

  // Absolute final guarantee for Hard: no playable cell may be empty.
  if(mode==="hard"){
   const occupiedCells=new Set(arr.map(a=>key(a.x,a.y)));
   if(occupiedCells.size!==cells.length)continue;
  }

  return {
   n:cfg.n,
   type,
   valid:cells,
   arrows:shuffle(arr)
  };
 }

 // If the randomized construction fails repeatedly, use a deterministic
 // full-board construction for Hard.
 return fallback();
}
function fallback(){
 const n=mode==="hard" ? (config(current).n||8) : 6;
 const cells=Array.from({length:n*n},(_,i)=>({x:i%n,y:Math.floor(i/n)}));
 const valid=new Set(cells.map(c=>key(c.x,c.y)));
 const arr=[];
 const occupied=new Set();

 if(mode==="hard"){
  /*
   * Deterministic construction:
   * Use an outward-facing direction whenever possible. Because cells are
   * processed from the outside toward the inside, each newly-added arrow
   * has a clear route through the already empty side of the board.
   */
  const ordered=[...cells].sort((a,b)=>{
   const da=Math.min(a.x,n-1-a.x,a.y,n-1-a.y);
   const db=Math.min(b.x,n-1-b.x,b.y,n-1-b.y);
   return da-db;
  });

  for(const c of ordered){
   const choices=[];
   if(c.x===0)choices.push("L");
   if(c.x===n-1)choices.push("R");
   if(c.y===0)choices.push("U");
   if(c.y===n-1)choices.push("D");

   const all=shuffle(["U","R","D","L"]);
   const d=[...choices,...all].find(dir=>
     rayClear({x:c.x,y:c.y,d:dir},occupied,valid,n)
   ) || "U";

   arr.push({
    x:c.x,
    y:c.y,
    d,
    id:arr.length,
    color:COLORS[arr.length%COLORS.length]
   });
   occupied.add(key(c.x,c.y));
  }
 }else{
  const candidates=cells.filter(c=>
   c.x===0||c.x===n-1||c.y===0||c.y===n-1
  );

  for(const c of shuffle(candidates).slice(0,12)){
   const d=c.x===0?"L":c.x===n-1?"R":c.y===0?"U":"D";
   arr.push({
    x:c.x,
    y:c.y,
    d,
    id:arr.length,
    color:COLORS[arr.length%COLORS.length]
   });
  }
 }

 return {n,type:"square",valid:cells,arrows:arr};
}
/* ---------- rendering ---------- */
function render(){
 board.style.setProperty("--n",game.n);
 board.innerHTML="";
 const valid=new Set(game.valid.map(c=>key(c.x,c.y)));
 for(let y=0;y<game.n;y++)for(let x=0;x<game.n;x++){
  const cell=document.createElement("div");
  cell.className=valid.has(key(x,y))?"cell valid":"cell invalid";
  board.appendChild(cell);
 }
 for(const a of game.arrows){
  const cell=board.children[a.y*game.n+a.x]; if(!cell)continue;
  const el=document.createElement("div");
  el.className="arrow";
  el.dataset.id=a.id;
  el.textContent=DIRS[a.d].s;
  el.style.background=`linear-gradient(145deg,${lighten(a.color,16)},${a.color})`;
  el.addEventListener("pointerdown",e=>{e.preventDefault();move(a.id)});
  cell.appendChild(el);
 }
 updateUI();
}
function lighten(hex,n){
 let v=parseInt(hex.slice(1),16),r=Math.min(255,(v>>16)+n),g=Math.min(255,((v>>8)&255)+n),b=Math.min(255,(v&255)+n);
 return"#"+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}

/* ---------- move validation ---------- */
function canMove(a){
 const valid=new Set(game.valid.map(c=>key(c.x,c.y)));
 const occ=new Set(game.arrows.map(z=>key(z.x,z.y)));
 occ.delete(key(a.x,a.y));
 return rayClear(a,occ,valid,game.n);
}
function move(id){
 if(locked||paused||!game)return;
 const a=game.arrows.find(z=>z.id===id);if(!a)return;
 if(!canMove(a)){
  errors++;combo=0;updateUI();toast("Blocked — clear the arrow in front first");shake(id);beep(150,.07,"square");
  return;
 }
 if(!started)startTimer();
 history.push(game.arrows.map(z=>({...z})));
 moves++;addLog("Arrow cleared","good");
 combo++;bestCombo=Math.max(bestCombo,combo);
 const el=document.querySelector(`.arrow[data-id="${id}"]`);
 if(el){
  const d=DIRS[a.d],dist=game.n*95;
  el.style.setProperty("--ex",d.dx*dist+"px");
  el.style.setProperty("--ey",d.dy*dist+"px");
  el.style.setProperty("--rot",(360+d.rot)+"deg");
  el.classList.add("exit");particles(el,a.color);
 }
 beep(420+Math.min(moves,30)*7,.06,"sine"); if(combo>=2) showCombo(combo);
 locked=true;
 setTimeout(()=>{
  game.arrows=game.arrows.filter(z=>z.id!==id);
  locked=false;
  message("Nice move!");
  render();
  if(!game.arrows.length)finish();
 },190);
}
function shake(id){
 const el=document.querySelector(`.arrow[data-id="${id}"]`);
 if(el){el.classList.remove("blocked");void el.offsetWidth;el.classList.add("blocked")}
}
function undo(){
 if(locked||!history.length)return;
 game.arrows=history.pop().map(z=>({...z}));
 moves=Math.max(0,moves-1);
 if(game.arrows.length)hintId=null;
 message("Move undone");addLog("Undo");beep(260,.06,"triangle");render();
}

/* ---------- hint ---------- */
function hint(){
 if(locked||!game.arrows.length)return;
 hintId=null;
 const a=game.arrows.find(z=>canMove(z));
 if(!a)return;
 hintId=a.id;
 render();
 const el=document.querySelector(`.arrow[data-id="${a.id}"]`);
 if(el)el.classList.add("hint");
 message("💡 This arrow is clear");addLog("Hint used");
 setTimeout(()=>{hintId=null;render();message("Find an arrow with a clear path.")},1600);
}

/* ---------- scoring ---------- */
function stars(){
 const cfg=config(current);
 const ideal=cfg.count;
 const generous=ideal+Math.ceil(ideal*.35);
 if(errors===0&&moves<=ideal)return 3;
 if(errors<=2&&moves<=generous)return 2;
 return 1;
}
function updateUI(){
 const cfg=config(current),s=stars();
 $("combo").textContent=combo+"×";
 $("level").textContent=mode[0].toUpperCase()+mode.slice(1)+" · Level "+current;
 $("diff").textContent=cfg.difficulty;
 $("fillInfo").textContent=mode==="hard" ? "DENSE COLUMNS • MORE SPACE TO THINK" : mode==="medium" ? "DENSE BOARD" : "BEGINNER BOARD";
 $("moves").textContent=moves;
 $("left").textContent=game?game.arrows.length:0;
 $("errors").textContent=errors;
 $("time").textContent=timeText(elapsed);
 [...$("stars").children].forEach((x,i)=>x.classList.toggle("on",i<s));
}

/* ---------- timer ---------- */
function startTimer(){
 if(started)return;
 started=true;
 timer=setInterval(()=>{if(!paused){elapsed++;$("time").textContent=timeText(elapsed)}},1000);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function resetTimer(){stopTimer();started=false;elapsed=0}

/* ---------- level ---------- */
function loadLevel(level=current){
 current=Math.max(1,Math.max(1,level));
 save();resetTimer();history=[];moves=0;errors=0;combo=0;bestCombo=0;paused=false;locked=false;hintId=null;
 game=buildPuzzle();message(mode==="hard" ? `Dense board: ${game.arrows.length}/${game.valid.length} arrows` : "Find an arrow with a clear path.");render();
}
function finish(){
 locked=true;stopTimer();
 const s=stars(),old=scores[current];
 if(!old||s>old.stars||(s===old.stars&&(moves<old.moves||(moves===old.moves&&elapsed<old.time)))){
  scores[current]={stars:s,moves,time:elapsed,errors};
 }
 if(current>=unlocked)unlocked=current+1;
 streak++;save();
 $("wm").textContent=moves;$("wt").textContent=timeText(elapsed);$("we").textContent=errors;
 $("winStars").textContent="★".repeat(s)+"☆".repeat(3-s);
 $("winSub").textContent=s===3?"Perfect run!":s===2?"Great solve!":"Puzzle cleared!";
 $("win").classList.add("show");
 beep(820,.12);setTimeout(()=>beep(1040,.15),120);
}

/* ---------- levels ---------- */
function showLevels(){
 const list=$("levelList");list.innerHTML="";
 for(let i=1;i<=Math.max(unlocked+20, current+20);i++){
  const b=document.createElement("button");b.className="levelBtn";
  const lockedLevel=i>unlocked;
  b.textContent=lockedLevel?"🔒":i;
  if(i===current)b.classList.add("current");
  if(lockedLevel)b.classList.add("locked");else b.onclick=()=>{$("levelsModal").classList.remove("show");loadLevel(i)};
  list.appendChild(b);
 }
 $("levelsModal").classList.add("show");
}

/* ---------- UI extras ---------- */
function addLog(t,type="info"){const l=document.getElementById("logList");if(!l)return;const e=document.createElement("div");e.className="log-item "+type;e.textContent=t;l.prepend(e);while(l.children.length>8)l.lastElementChild.remove()}function clearLog(){const l=document.getElementById("logList");if(l)l.innerHTML="";addLog("Ready","info")}function message(t){$("message").textContent=t}
function showCombo(n){const el=$("comboPop");el.textContent="🔥 "+n+" COMBO";el.classList.remove("show");void el.offsetWidth;el.classList.add("show")}
let toastTimer;
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),1200)}
function particles(el,color){
 const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 for(let i=0;i<8;i++){
  const p=document.createElement("div");p.className="particle";p.style.background=color;p.style.left=cx+"px";p.style.top=cy+"px";
  const ang=Math.random()*Math.PI*2,dist=18+Math.random()*55;p.style.setProperty("--x",Math.cos(ang)*dist+"px");p.style.setProperty("--y",Math.sin(ang)*dist+"px");
  document.body.appendChild(p);setTimeout(()=>p.remove(),600);
 }
}

/* ---------- audio ---------- */
let audio;
function beep(freq=500,dur=.06,type="sine"){
 try{
  audio??=new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  const o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(audio.destination);o.start();
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.stop(audio.currentTime+dur);
 }catch{}
}

/* ---------- theme ---------- */
function setTheme(){
 document.body.classList.toggle("dark",dark);
}
dark=dark;setTheme();

/* ---------- events ---------- */
$("undo").onclick=undo;
$("hint").onclick=hint;
$("restart").onclick=()=>loadLevel(current);addLog(mode==="hard" ? "Hard mode • deep dependency puzzle" : "Ready");
$("levels").onclick=showLevels;
$("closeLevels").onclick=()=>$("levelsModal").classList.remove("show");
$("theme").onclick=()=>{dark=!dark;save();setTheme()};
$("pause").onclick=()=>{
 if(!game||locked)return;
 paused=true;
 $("pauseModal").classList.add("show");
 message("Game paused");
};
$("resume").onclick=()=>{
 paused=false;
 $("pauseModal").classList.remove("show");
 message("Find an arrow with a clear path.");
};
$("replay").onclick=()=>{$("win").classList.remove("show");loadLevel(current)};
$("clearLog").onclick=clearLog;
$("next").onclick=()=>{$("win").classList.remove("show");loadLevel(current+1)};


document.querySelectorAll(".modeBtn").forEach(btn=>{
 btn.onclick=()=>{
  mode=btn.dataset.mode;
  current=1;
  unlocked=1;
  scores={};
  save();
  document.querySelectorAll(".modeBtn").forEach(x=>x.style.outline="none");
  btn.style.outline="3px solid var(--accent)";
  loadLevel(1);
  toast(mode.charAt(0).toUpperCase()+mode.slice(1)+" mode");
 };
});
document.querySelectorAll(".modeBtn").forEach(btn=>{
 if(btn.dataset.mode===mode)btn.style.outline="3px solid var(--accent)";
});

document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){
  if($("pauseModal").classList.contains("show"))$("resume").click();
  else if(started&&!locked){paused=true;$("pauseModal").classList.add("show")}
 }
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z")undo();
});

/* Prevent accidental browser gestures on the game surface. */
board.addEventListener("contextmenu",e=>e.preventDefault());
board.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault?.());

/* ---------- start ---------- */
loadLevel(current);
</script>
</body>
</html>
